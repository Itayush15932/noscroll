name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project NoScroll.xcodeproj \
            -target NoScroll \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the app file
        run: |
          APP_PATH="$(find build -type d -name 'NoScroll.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "NoScroll.app was not found in the build output"
            exit 1
          fi
          echo "Found: $APP_PATH"
          rm -rf Payload NoScroll.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry NoScroll.ipa Payload
          ls -lh NoScroll.ipa

      - name: Keep the app file with this run
        uses: actions/upload-artifact@v4
        with:
          name: NoScroll-ipa
          path: NoScroll.ipa

      - name: Publish as the latest download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest NoScroll.ipa \
            --title "NoScroll (latest build)" \
            --notes "Automatic build of the newest code." \
            --target "$GITHUB_SHA"
