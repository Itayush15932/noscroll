name: NoScroll
options:
  bundleIdPrefix: com.noscroll
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  NoScroll:
    type: application
    platform: iOS
    sources:
      - path: NoScroll
    info:
      path: NoScroll/Info.plist
      properties:
        CFBundleDisplayName: NoScroll
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Used when you take a photo or video to post.
        NSMicrophoneUsageDescription: Used when you record a video or a voice message.
        NSPhotoLibraryUsageDescription: Used when you choose a photo or video to post.
        NSPhotoLibraryAddUsageDescription: Used when you save a photo or video.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noscroll.app
        PRODUCT_NAME: NoScroll
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
